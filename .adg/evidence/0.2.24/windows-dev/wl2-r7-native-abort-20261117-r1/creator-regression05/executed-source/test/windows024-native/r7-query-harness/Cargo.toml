[package]
name = "windows024-r7-query-proof"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
tempfile = "3"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "r7-scene-observer"
path = "src/observer.rs"

[[bin]]
name = "r7-abort-fixture"
path = "src/abort_fixture.rs"
