          if((git -C test/out/raw-full0c/original-source rev-parse HEAD:apps).Trim() -cne 'cf7ca5b19438d9157ada555d0451f91d768b1cf9'){throw 'Original product source differs'}
          [ordered]@{productSource='0c869d9497c102b714dea1ee89394f999da8c4ec';helperSource=(git rev-parse HEAD).Trim();helperSha256=(Get-FileHash test/smoke/windows023-two-user-native-helper.ps1).Hash.ToLowerInvariant();changed=$changed;productChanged=$false}|ConvertTo-Json|Set-Content test/out/raw-full0c/input/declared-test-helper.json
      - name: Verify two actual SIDs and ports from the same complete original MSI payload
        shell: pwsh
