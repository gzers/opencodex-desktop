name: Windows published release acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        required: true
        default: installers
        options: [installers, ota]
      version:
        type: string
        required: true
        default: '0.2.18'
      from_version:
        type: string
        required: true
        default: '0.2.17'
      built_sha256:
        description: Original Windows build SHA-256 from the release installer evidence
        type: string
        required: false
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        kind: [msi, nsis]
        mode: [default, custom]
    permissions:
      contents: write
    if: inputs.phase == 'installers'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify exact existing signed release installers without rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          OCX_ACCEPT_VERSION: ${{ inputs.version }}
          OCX_BUILT_SHA256: ${{ inputs.built_sha256 }}
        run: ./test/smoke/windows-release-installers.ps1 -OutputDirectory test/out/release-existing-installers -Kind ${{ matrix.kind }} -Mode ${{ matrix.mode }} -Version $env:OCX_ACCEPT_VERSION -ExpectedBuiltSha256 $env:OCX_BUILT_SHA256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-existing-installer-${{ matrix.kind }}-${{ matrix.mode }}
          path: |
            test/out/release-existing-installers/**/*.json
            test/out/release-existing-installers/**/*.log
            test/out/release-existing-installers/**/*.png
          if-no-files-found: error
  ota:
    if: inputs.phase == 'ota'
    strategy:
      fail-fast: false
      matrix:
        kind: [msi, nsis]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Published adjacent-release actual signed updater and restart
        shell: pwsh
        env:
          OCX_BASELINE_VERSION: ${{ inputs.from_version }}
          OCX_ACCEPT_VERSION: ${{ inputs.version }}
        run: ./test/smoke/windows-ota.ps1 -Kind '${{ matrix.kind }}' -OutputDirectory 'test/out/windows-ota-${{ matrix.kind }}' -Version $env:OCX_ACCEPT_VERSION -FromVersion $env:OCX_BASELINE_VERSION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ota-${{ matrix.kind }}
          path: |
            test/out/windows-ota-${{ matrix.kind }}/*.json
            test/out/windows-ota-${{ matrix.kind }}/*.png
            test/out/windows-ota-${{ matrix.kind }}/actual-sandbox/logs/*.log
          if-no-files-found: error
