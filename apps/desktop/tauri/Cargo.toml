[package]
name = "opencodex-desktop"
version = "0.1.9"
description = "OpenCodeX Desktop manager shell"
license = "MIT"
edition = "2021"
# 1.89：`std::fs::File` 的 lock/try_lock/unlock 在该版本稳定，跨平台文件锁不再依赖 libc。
rust-version = "1.89"
default-run = "opencodex-desktop"

[lib]
name = "opencodex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ocxd"
path = "src/bin/ocxd.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 构建期校验并嵌入固化默认配置（config/*.defaults.json）。
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
serde_yaml = "0.9"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
# 离线包（`.tgz`）的解包与条目校验：只用标准实现，不自己写 DEFLATE（FZ-49）。
flate2 = "1"
tar = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
dirs = "6"
rand = "0.9"
uuid = { version = "1.26.1", features = ["v4"] }
sha2 = "0.10"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
aes-gcm = { version = "0.10.3", features = ["std", "zeroize"] }
base64 = "0.22.1"
async-trait = "0.1.89"
zeroize = "1.8.1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "io-util"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.11.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tauri-plugin-dialog = "2.7.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# macOS 系统代理发现；仅 macOS 需要，避免在 Windows 上拉起 core-foundation。
reqwest = { version = "0.12", default-features = false, features = ["json", "macos-system-configuration", "rustls-tls-native-roots"] }
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
http = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
png = "0.17"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
integration-test = ["tauri/test"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
