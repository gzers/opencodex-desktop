name: Publish Release

# 显式公开发布：把 Release 工作流创建的「草稿 + 预发布」包取消草稿，使其对公众可见。
# 触发靠专用 tag（publish/vX.Y.Z），不修改既有 vX.Y.Z 历史，也不需要把发布凭据放到本机。
# 说明：本工作流只做可见性切换，不重新构建、不改动制品与说明正文。
on:
  push:
    tags: ['publish/v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 解析目标 tag
        id: target
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#publish/}"
          if [[ ! "$tag" =~ ^v[0-9]+.[0-9]+.[0-9]+$ ]]; then
            echo "::error::发布 tag 形如 publish/vX.Y.Z，收到 $GITHUB_REF_NAME"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "目标版本：$tag"

      - name: 取消草稿并标记为最新
        env:
          # 与 Release 工作流同口径：优先 PAT，缺省用 GITHUB_TOKEN。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.target.outputs.tag }}" --draft=false --latest
          gh release view "${{ steps.target.outputs.tag }}" --json tagName,isDraft,isPrerelease,url \
            --template '{{.tagName}} draft={{.isDraft}} prerelease={{.isPrerelease}} {{.url}}{{"\n"}}'
