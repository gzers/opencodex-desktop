name: Windows published release acceptance
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        default: '0.2.17'
permissions:
  contents: read
jobs:
  ota:
    strategy:
      fail-fast: false
      matrix:
        kind: [msi, nsis]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Published 0.2.16 to 0.2.17 actual signed updater and restart
        shell: pwsh
        env:
          OCX_ACCEPT_VERSION: ${{ inputs.version }}
        run: ./test/smoke/windows-ota.ps1 -Kind '${{ matrix.kind }}' -OutputDirectory 'test/out/windows-ota-${{ matrix.kind }}' -Version $env:OCX_ACCEPT_VERSION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ota-${{ matrix.kind }}
          path: test/out/windows-ota-${{ matrix.kind }}
          if-no-files-found: error
