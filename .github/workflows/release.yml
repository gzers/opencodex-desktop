name: Release

# 打 tag（v*）即出包：先建 Release（默认草稿 + 预发布），再由各平台 job 上传制品。
# 也可以手动触发：Actions → Release → Run workflow，填一个已存在的 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v0.1.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS（Apple Silicon）
          - platform: macos-14
            rust_targets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          # macOS（Intel）——需要时取消注释
          # - platform: macos-13
          #   rust_targets: x86_64-apple-darwin
          #   args: '--target x86_64-apple-darwin'
          #
          # Windows（x64）：未签名 nsis/msi 测试包。代码侧跨平台改造已完成
          # （keyring 后端、按 cfg 收口、Unix 专属代码平台分支），见
          # docs/03-开发实施/REL-OPENCODEX-DESKTOP-01.md 的版本说明约定一节。
          - platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: 安装前端依赖
        run: npm --prefix apps/desktop/ui ci

      # Release 说明的事实源是仓库根 CHANGELOG.md。tauri-action 没有 releaseBodyPath，
      # 所以先按 tag 抽出版本段落，再作为 releaseBody 传下去。
      - name: 提取 CHANGELOG 版本说明
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="${tag#v}"
          if ! grep -qE "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 '## [${version}]' 段落；发布前先补写该版本说明。"
            exit 1
          fi
          body="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && substr($0, 1, 3) == "## " { exit }
            on { print }
          ' CHANGELOG.md)"
          {
            echo "tag=${tag}"
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$body"
            echo ""
            echo "---"
            echo ""
            echo "### 安装"
            echo "- macOS（Apple Silicon）：下载 \`.dmg\`，拖入「应用程序」。"
            echo "- Windows（x64）：下载 \`*-setup.exe\`（NSIS）安装包。"
            echo "- 均为未签名测试包：macOS 首次打开如被 Gatekeeper 拦截，右键 →「打开」；Windows SmartScreen 可能提示，选择「仍要运行」。"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # 临时诊断：打印本次运行里 GITHUB_TOKEN 的实际仓库权限，以及创建 Release 的返回码。
      # 仅用于排查发布权限问题，定位后删除。若返回 201 会立即把探针 Release/tag 删掉。
      - name: 诊断 Release 权限
        shell: bash
        run: |
          set -uo pipefail
          token="${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}"
          api="https://api.github.com/repos/gzers/opencodex-desktop"
          list_code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github+json' \
            "$api/releases?per_page=1")
          echo "::error::DIAG_LIST=$list_code"
          perms=$(curl -s -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github+json' \
            "$api" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("permissions"))')
          echo "::error::DIAG_PERMS=$perms"
          code=$(curl -s -o /tmp/diag.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github+json' \
            "$api/releases" \
            -d '{"tag_name":"diag-probe","name":"diag-probe","draft":true,"prerelease":true}')
          echo "::error::DIAG_CREATE=$code"
          echo "::error::DIAG_BODY=$(head -c 180 /tmp/diag.json | tr -d '\n')"
          if [ "$code" = "201" ]; then
            rid=$(python3 -c 'import json;print(json.load(open("/tmp/diag.json"))["id"])')
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $token" "$api/releases/$rid"
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $token" "$api/git/refs/tags/diag-probe"
            echo "::error::DIAG_CLEANUP=done"
          fi

      - name: 打 tag 与出包（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          # 允许用 PAT 覆盖：仓库若无法给 GITHUB_TOKEN 写权限，配置 secret RELEASE_TOKEN 即可。
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/tauri
          tagName: ${{ steps.notes.outputs.tag }}
          releaseName: 'OpenCodeX Desktop ${{ steps.notes.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
