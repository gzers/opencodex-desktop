[package]
name = "ocxd-model-v2-core-check"
version = "0.1.0"
edition = "2021"
[lib]
path = "lib.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8.22"
sha2 = "0.10"
uuid = "1.26.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false }
