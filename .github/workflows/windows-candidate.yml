          try{
            & (Join-Path $taskTools 'windows023-two-user-native.ps1') -Executable $taskImages[0].FullName -Node (Join-Path $taskDriver 'runtime/node/node.exe') -OutputDirectory $taskEvidence -ExpectedCommit '0c869d9497c102b714dea1ee89394f999da8c4ec' -VerifyRuntimePorts
            if($LASTEXITCODE -ne 0){throw 'Original package actual twoSID/runtime ports failed'}
            $taskResult=Get-Content -LiteralPath (Join-Path $taskEvidence 'two-user-native.json') -Raw|ConvertFrom-Json
            if(!$taskResult.fullVersionGatePassed -or $taskResult.runtimeProxyPortIsolation -cne 'verified-runtime-ports'){throw 'Original twoSID evidence incomplete'}
          }finally{
