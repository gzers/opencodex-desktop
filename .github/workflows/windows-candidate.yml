          $taskPayload=Join-Path $env:RUNNER_TEMP ('ocxd023-raw-payload-'+[guid]::NewGuid().ToString('N'))
          $taskMsi=Join-Path $taskRoot 'OpenCodeX Desktop_0.2.23_x64_en-US.msi'
          $taskProcess=Start-Process msiexec.exe -ArgumentList ('/a "'+$taskMsi+'" /qn TARGETDIR="'+$taskPayload+'" /L*v "'+(Join-Path $taskRoot 'administrative-extract.log')+'"') -Wait -PassThru
          if($taskProcess.ExitCode -ne 0){throw 'Original MSI payload extraction failed'}
          $taskImages=@(Get-ChildItem -LiteralPath $taskPayload -Recurse -Filter opencodex-desktop.exe)
          if($taskImages.Count -ne 1){throw 'One exact complete original MSI payload required'}
          $taskProgram=$taskImages[0].DirectoryName
          node test/smoke/windows-bundle-identity.mjs (Join-Path $taskRoot 'opencodex-desktop.exe') $taskImages[0].FullName msi
