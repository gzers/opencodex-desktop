name: CI

on:
  push:
    branches: [main, docs/governance-main, 'feature/**']
  pull_request:

jobs:
  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: python3 -B -m unittest discover -s test -p 'test_publish_release.py' -v

  frontend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Windows CDP protocol regression
        run: node --test test/smoke/windows-cdp.test.mjs
      - run: npm --prefix apps/desktop/ui ci
      - run: npm --prefix apps/desktop/ui run typecheck
      - run: npm --prefix apps/desktop/ui run test -- --run
      - run: npm --prefix apps/desktop/ui run build

  backend:
    runs-on: macos-14
    # Cargo 清单在 apps/desktop/tauri/Cargo.toml（仓库根无 Cargo.toml）；cargo 命令必须在
    # apps/desktop/tauri 下执行，否则根目录会以「could not find Cargo.toml」立即失败（DEF-01）。
    defaults:
      run:
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --features integration-test

  # Windows 不仅编译：运行后端回归，并启动最终 EXE 检查无 HOME 环境、
  # 隔离数据初始化和 WebView 首屏。该 job 不生成安装器或发布制品。
  backend-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm --prefix ../ui ci
      - run: npm --prefix ../ui run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Windows backend regression
        shell: pwsh
        run: |
          $env:OPENCODEX_TEST_NODE = (Get-Command node).Source
          cargo test --workspace --features integration-test
      - run: cargo build --release --features custom-protocol --bins
      - name: Windows final EXE smoke
        shell: pwsh
        run: |
          & ../../../test/smoke/windows-startup.ps1 -Executable target/release/opencodex-desktop.exe -Node (Get-Command node).Source -OutputDirectory ../../../test/out/windows-startup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-evidence
          path: test/out/windows-startup

  build:
    if: github.ref == 'refs/heads/main'
    needs: [frontend, backend, backend-windows, release-tools]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: Install frontend deps (build job installs its own, not relying on frontend job)
        run: npm --prefix apps/desktop/ui ci
      - name: Build macOS arm64 bundle
        # tauri.conf.json 在 apps/desktop/tauri（仓库根没有），必须在应用目录里执行 CLI，
        # 否则根目录直接以「could not find tauri.conf.json」失败（IMP-03 目录迁移后遗留）。
        working-directory: apps/desktop/tauri
        run: tauri build --target aarch64-apple-darwin
