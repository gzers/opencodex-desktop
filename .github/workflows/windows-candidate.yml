name: Windows candidate installer

on:
  push:
    branches: [feature/0.1.8-windows-package]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - name: Validate installer smoke syntax
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ../../../test/smoke/windows-installer.ps1).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify strict bundle identity checks
        run: |
          node --test ../../../test/smoke/windows-bundle-identity.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri -> target
          cache-on-failure: true
      - name: Install pinned CLI and frontend
        run: |
          npm install --global @tauri-apps/cli@2.11.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix ../ui ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix ../ui run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freeze and record dependency resolution
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ../../../test/out/windows-candidate | Out-Null
          Copy-Item Cargo.lock ../../../test/out/windows-candidate/Cargo.lock
          cargo metadata --locked --format-version 1 > ../../../test/out/windows-candidate/cargo-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{ source = (git rev-parse HEAD); runner = $env:ImageOS; image = $env:ImageVersion; rust = (rustc --version); cargo = (cargo --version); node = (node --version); npm = (npm --version); tauri = (tauri --version) } | ConvertTo-Json | Set-Content ../../../test/out/windows-candidate/environment.json
      - name: Windows regression with the package lock
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OPENCODEX_TEST_NODE = (Get-Command node).Source
          cargo test --locked --workspace --features integration-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build NSIS and MSI candidates
        run: |
          # The npm PowerShell shim consumes the standalone -- separator.
          # Invoke its JavaScript entry through the native node executable.
          $taskTauriCli = Join-Path (npm root --global) '@tauri-apps/cli/tauri.js'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $taskTauriCli build --bundles nsis,msi -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, verify final EXE and uninstall on isolated runner
        run: |
          & ../../../test/smoke/windows-installer.ps1 -BundleDirectory target/release/bundle -BuiltExecutable target/release/opencodex-desktop.exe -Node (Get-Command node).Source -OutputDirectory ../../../test/out/windows-candidate
      - name: Upload verified Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: opencodex-desktop-0.1.8-windows-x64-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/tauri/target/release/bundle/msi/*.msi
            test/out/windows-candidate/installer-verification.json
      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-evidence
          if-no-files-found: error
          retention-days: 14
          path: test/out/windows-candidate
