name: Release

# 打 tag（v*）即出包：先建 Release（默认草稿 + 预发布），再由各平台 job 上传制品。
# 也可以手动触发：Actions → Release → Run workflow，填一个已存在的 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v0.1.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS（Apple Silicon）
          - platform: macos-14
            rust_targets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          # macOS（Intel）——需要时取消注释
          # - platform: macos-13
          #   rust_targets: x86_64-apple-darwin
          #   args: '--target x86_64-apple-darwin'
          #
          # Windows：流水线已就位，但代码侧还有前置改造（见 docs/03-开发实施 中的发布说明）：
          #   1) `infrastructure/keychain.rs` 直接依赖 macOS 的 `security-framework`，需要抽成
          #      「密钥存储」抽象并补 Windows（凭据管理器 / wincred）实现；
          #   2) `Cargo.toml` 里 `security-framework` 与 `reqwest` 的 `macos-system-configuration`
          #      需要按平台 cfg 收口；
          #   3) `tauri.conf.json` 的 `bundle.targets` 需要包含 `nsis`（本文件已改为 "all"）。
          # 前置改造完成后再取消注释即可出 Windows 安装包。
          # - platform: windows-latest
          #   rust_targets: ''
          #   args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: 安装前端依赖
        run: npm --prefix apps/desktop/ui ci

      # Release 说明的事实源是仓库根 CHANGELOG.md。tauri-action 没有 releaseBodyPath，
      # 所以先按 tag 抽出版本段落，再作为 releaseBody 传下去。
      - name: 提取 CHANGELOG 版本说明
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="${tag#v}"
          if ! grep -qE "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 '## [${version}]' 段落；发布前先补写该版本说明。"
            exit 1
          fi
          body="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && substr($0, 1, 3) == "## " { exit }
            on { print }
          ' CHANGELOG.md)"
          {
            echo "tag=${tag}"
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$body"
            echo ""
            echo "---"
            echo ""
            echo "### 安装"
            echo "- macOS（Apple Silicon）：下载 \`.dmg\`，拖入「应用程序」。"
            echo "- 未签名测试包；首次打开如被 Gatekeeper 拦截，右键 →「打开」。"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 打 tag 与出包（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/tauri
          tagName: ${{ steps.notes.outputs.tag }}
          releaseName: 'OpenCodeX Desktop ${{ steps.notes.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
