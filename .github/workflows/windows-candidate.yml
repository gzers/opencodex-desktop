  full-bundle-two-user-debug:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'native-ui' && inputs.admission_run == 'full-bundle-two-user-debug'
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.8.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri -> target
          shared-key: windows-native-ui-018
          cache-on-failure: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: gzers/opencodex-desktop
          run-id: 42374536779
          name: windows-raw-installers-unverified-0c869d9497c102b714dea1ee89394f999da8c4ec
          path: test/out/full-bundle-two-user-debug/input
      - name: Stage exact original distribution resources only
        shell: pwsh
        run: |
          $root=(Resolve-Path test/out/full-bundle-two-user-debug/input).Path
          $receipt=Get-Content (Join-Path $root 'build-identities.json') -Raw|ConvertFrom-Json
          if($receipt.source -cne '0c869d9497c102b714dea1ee89394f999da8c4ec' -or $receipt.status -cne 'unverified-build-only'){throw 'Original distribution identity differs'}
          foreach($file in $receipt.files){if((Get-FileHash -LiteralPath (Join-Path $root $file.name)).Hash.ToLowerInvariant() -cne $file.sha256){throw 'Original bytes differ'}}
          $payload=Join-Path $env:RUNNER_TEMP ('ocxd023-debug-payload-'+[guid]::NewGuid().ToString('N'))
          $p=Start-Process msiexec.exe -ArgumentList ('/a "'+(Join-Path $root 'OpenCodeX Desktop_0.2.23_x64_en-US.msi')+'" /qn TARGETDIR="'+$payload+'"') -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Original resource payload extraction failed'}
          $images=@(Get-ChildItem $payload -Recurse -Filter opencodex-desktop.exe)
          if($images.Count -ne 1){throw 'One complete original payload required'}
          $resources=Join-Path $images[0].DirectoryName 'runtime-bundle'
          Copy-Item -LiteralPath $resources -Destination apps/desktop/tauri/resources/runtime-bundle -Recurse
          'OCXD_REQUIRE_RUNTIME_BUNDLE=1' >> $env:GITHUB_ENV
          'OCXD_DEBUG_PAYLOAD='+$images[0].DirectoryName >> $env:GITHUB_ENV
      - name: Build current production code with exact complete distribution pin
        shell: pwsh
        run: |
          npm --prefix apps/desktop/ui ci
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          npm --prefix apps/desktop/ui run build
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          cargo build --manifest-path apps/desktop/tauri/Cargo.toml --locked --features custom-protocol --bins --jobs 2
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Run actual two ordinary users with current binary and original pinned resources
        shell: pwsh
        run: |
          $candidate=Join-Path $env:RUNNER_TEMP ('ocxd023-debug-complete-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $candidate|Out-Null
          Copy-Item apps/desktop/tauri/target/debug/opencodex-desktop.exe,apps/desktop/tauri/target/debug/ocxd.exe -Destination $candidate
          Copy-Item -LiteralPath (Join-Path $env:OCXD_DEBUG_PAYLOAD 'runtime-bundle') -Destination $candidate -Recurse
          $driver=Join-Path $env:RUNNER_TEMP ('ocxd023-debug-node-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $driver|Out-Null
          tar -xzf (Join-Path $candidate 'runtime-bundle/runtime-bundle-0.2.23-win32-x64.tar.gz') -C $driver runtime/node
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $out=Join-Path $env:RUNNER_TEMP ('ocxd023-debug-users-'+[guid]::NewGuid().ToString('N'))
          try{ & test/smoke/windows023-two-user-native.ps1 -Executable (Join-Path $candidate 'opencodex-desktop.exe') -Node (Join-Path $driver 'runtime/node/node.exe') -OutputDirectory $out -ExpectedCommit (git rev-parse HEAD).Trim() -VerifyRuntimePorts }
          finally{if(Test-Path $out){Copy-Item -LiteralPath $out -Destination test/out/full-bundle-two-user-debug/evidence -Recurse}}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-bundle-two-user-debug
          if-no-files-found: error
          path: |
            test/out/full-bundle-two-user-debug/input/build-identities.json
            test/out/full-bundle-two-user-debug/evidence/*.json
            test/out/full-bundle-two-user-debug/evidence/*.log
            test/out/full-bundle-two-user-debug/evidence/user1/*.json
            test/out/full-bundle-two-user-debug/evidence/user1/*.log
            test/out/full-bundle-two-user-debug/evidence/user1/*/*.json
            test/out/full-bundle-two-user-debug/evidence/user1/*/*.log
            test/out/full-bundle-two-user-debug/evidence/user1/*/*.png
            test/out/full-bundle-two-user-debug/evidence/user2/*.json
            test/out/full-bundle-two-user-debug/evidence/user2/*.log
            test/out/full-bundle-two-user-debug/evidence/user2/*/*.json
            test/out/full-bundle-two-user-debug/evidence/user2/*/*.log
            test/out/full-bundle-two-user-debug/evidence/user2/*/*.png

  raw-final023-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'native-ui' && inputs.admission_run == 'raw-final023-replay'
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26.8.1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: gzers/opencodex-desktop
          run-id: 42469646550
          artifact-ids: 13614917946
          merge-multiple: true
          path: test/out/final023-installer-replay/input
      - name: Verify exact original package and unchanged product source
        run: |
          $taskReplayRoot=[IO.Path]::GetFullPath('test/out/final023-installer-replay')
          $taskReplayInput=Join-Path $taskReplayRoot 'input'
          $identity=Get-Content -LiteralPath (Join-Path $taskReplayInput 'build-identities.json') -Raw|ConvertFrom-Json
          $expected='5cba024a298154bfb4378d4607b4905b4e2e167e'
          if($identity.source -cne $expected -or $identity.appsTree -cne 'e106149ef8a0f88ef4e2a51035fa821a32a6a486' -or $identity.run -cne '42469646550' -or $identity.attempt -cne '1' -or $identity.status -cne 'unverified-build-only' -or $identity.files.Count -ne 3){throw 'Exact raw originals required; never an accepted candidate'}
          $changed=@(git diff --name-only $expected HEAD -- apps)
          if($LASTEXITCODE -ne 0 -or $changed.Count){throw 'Product changed since these original installer bytes'}
          foreach($f in $identity.files){
            if($f.name -notin @('opencodex-desktop.exe','OpenCodeX Desktop_0.2.23_x64-setup.exe','OpenCodeX Desktop_0.2.23_x64_en-US.msi')){throw 'Unexpected original member'}
            $path=Join-Path $taskReplayInput $f.name
            if((Get-Item -LiteralPath $path).Length -ne $f.bytes -or (Get-FileHash -LiteralPath $path).Hash.ToLowerInvariant() -cne $f.sha256){throw 'Original package member differs'}
          }
          if((Get-FileHash -LiteralPath (Join-Path $taskReplayInput 'opencodex-desktop.exe')).Hash.ToLowerInvariant() -cne '5734ecf9427631de2282f8b5d0adb51ddb900601bdd5c9ae97ffa8645e8b42d0'){throw 'Original built EXE differs'}
          foreach($kind in @('msi','nsis')){New-Item -ItemType Directory -Path (Join-Path $taskReplayRoot ('bundle/'+$kind))|Out-Null}
          Copy-Item -LiteralPath (Join-Path $taskReplayInput 'OpenCodeX Desktop_0.2.23_x64_en-US.msi') -Destination (Join-Path $taskReplayRoot 'bundle/msi')
          Copy-Item -LiteralPath (Join-Path $taskReplayInput 'OpenCodeX Desktop_0.2.23_x64-setup.exe') -Destination (Join-Path $taskReplayRoot 'bundle/nsis')
          Copy-Item -LiteralPath (Join-Path $taskReplayInput 'build-identities.json') -Destination (Join-Path $taskReplayRoot 'original-build-identities.json')
      - name: Verify exact sentinel lifecycle without installers
        run: ./test/smoke/windows-retention-fixture.test.ps1 -OutputDirectory test/out/final023-installer-replay/fixture-contract
      - name: Prepare disposable Server MSI fixture
        run: ./test/smoke/windows-msi-server-fixture.ps1 -Mode prepare -EvidenceDirectory test/out/final023-installer-replay/evidence
      - name: Replay all original installer cells after test-only correction
        run: |
          & ./test/smoke/windows-installer.ps1 -BundleDirectory test/out/final023-installer-replay/bundle -BuiltExecutable test/out/final023-installer-replay/input/opencodex-desktop.exe -Node (Get-Command node.exe).Source -OutputDirectory test/out/final023-installer-replay/evidence -ExpectedCommit '5cba024a298154bfb4378d4607b4905b4e2e167e' -Kind all -Mode all
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          @{accepted=$false;diagnosticOnly=$true;formalCandidateAccepted=$false;source='5cba024a298154bfb4378d4607b4905b4e2e167e';harness=(git rev-parse HEAD).Trim();artifact=13614917946;scope='original four installer cells only; no two-user/OTA/release acceptance'}|ConvertTo-Json|Set-Content test/out/final023-installer-replay/diagnostic.json
      - name: Restore exact Server MSI policy
        if: always()
        run: if(Test-Path test/out/final023-installer-replay/evidence/msi-server-policy.original.json){ & ./test/smoke/windows-msi-server-fixture.ps1 -Mode restore -EvidenceDirectory test/out/final023-installer-replay/evidence }
      - name: Collect complete controlled receipts without private-tree traversal
        if: always()
        run: python test/smoke/collect_installer_replay.py test/out/final023-installer-replay
      - name: Preserve successful and failed replay receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final023-original-installer-replay-${{ github.sha }}
          path: test/out/final023-installer-replay/artifact/**
          if-no-files-found: warn
