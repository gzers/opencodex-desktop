name: Release

# 打 tag（v*）即出包：先建 Release（默认草稿 + 预发布），再由各平台 job 上传制品。
# 也可以手动触发：Actions → Release → Run workflow，填一个已存在的 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v0.1.0）'
        required: true
        type: string
      runtime_only:
        description: '仅为已构建且完成原包补验的草稿补交维护运行包，不重新构建桌面包'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || !inputs.runtime_only
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS（Apple Silicon）
          - platform: macos-15
            rust_targets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          # macOS（Intel）——需要时取消注释
          # - platform: macos-13
          #   rust_targets: x86_64-apple-darwin
          #   args: '--target x86_64-apple-darwin'
          #
          # Windows（x64）：未签名 nsis/msi 测试包。代码侧跨平台改造已完成
          # （keyring 后端、按 cfg 收口、Unix 专属代码平台分支），见
          # docs/03-开发实施/REL-OPENCODEX-DESKTOP-01.md 的版本说明约定一节。
          - platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          # Bundle resolution must use the same Node/npm pair as the pinned closure.
          node-version: 26.8.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Stage complete pinned platform runtime
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(node -p 'process.execPath')"
          npm_cli="$(node -e 'const p=require("node:path"),fs=require("node:fs");const n=process.execPath;const paths=[p.join(p.dirname(n),"node_modules/npm/bin/npm-cli.js"),p.join(p.dirname(n),"../lib/node_modules/npm/bin/npm-cli.js")];const hit=paths.find(v=>fs.existsSync(v));if(!hit)process.exit(1);process.stdout.write(p.resolve(hit))')"
          if [ "$RUNNER_OS" = Windows ]; then platform=win32-x64; else platform=darwin-arm64; fi
          python3 .github/scripts/stage_runtime_bundle_023.py --platform "$platform" --build-node "$node_bin" --npm-cli "$npm_cli" --output test/out/runtime-stage
          echo "OCXD_REQUIRE_RUNTIME_BUNDLE=1" >> "$GITHUB_ENV"

      - name: Install exact packaging CLI for bounded tool-download retries
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @tauri-apps/cli@2.11.4
          echo "OCXD_TAURI_CLI=$(npm root --global)/@tauri-apps/cli/tauri.js" >> "$GITHUB_ENV"
          echo "OCXD_TAURI_RETRY_EVIDENCE=$GITHUB_WORKSPACE/test/out/release-tauri-downloads" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        run: npm --prefix apps/desktop/ui ci

      # Release 说明的事实源是仓库根 CHANGELOG.md。tauri-action 没有 releaseBodyPath，
      # 所以先按 tag 抽出版本段落，再作为 releaseBody 传下去。
      - name: 提取 CHANGELOG 版本说明
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="${tag#v}"
          if ! grep -qE "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 '## [${version}]' 段落；发布前先补写该版本说明。"
            exit 1
          fi
          body="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && substr($0, 1, 3) == "## " { exit }
            on { print }
          ' CHANGELOG.md)"
          {
            echo "tag=${tag}"
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$body"
            echo ""
            echo "---"
            echo ""
            echo "### 安装"
            echo '- macOS（Apple Silicon）：下载 .dmg，将其中整个“OpenCodeX Desktop”文件夹复制到 ~/Applications，再打开文件夹中的应用；请勿只复制 .app 或从磁盘映像运行。'
            echo "- Windows（x64）：下载 \`*-setup.exe\`（NSIS）安装包。"
            echo "- 均为未签名测试包：macOS 首次打开如被 Gatekeeper 拦截，右键 →「打开」；Windows SmartScreen 可能提示，选择「仍要运行」。"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 打 tag 与出包（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          # 允许用 PAT 覆盖：仓库若无法给 GITHUB_TOKEN 写权限，配置 secret RELEASE_TOKEN 即可。
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # U-02 自更新签名：私钥只经 secret 注入，不进仓库、不进日志。
          # 无口令私钥只设 TAURI_SIGNING_PRIVATE_KEY；若给私钥设了口令，再加
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD。创建更新制品由 app 目录的
          # tauri.updater.conf.json 增量配置打开（`--config` 合并），只作用于发布/签名构建，
          # 不影响普通 `tauri build` 与本地免签构建。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/tauri
          # Custom installer templates are reviewed against this exact bundler.
          tauriScript: node ${{ github.workspace }}/.github/scripts/tauri_build_retry.mjs
          tagName: ${{ steps.notes.outputs.tag }}
          releaseName: 'OpenCodeX Desktop ${{ steps.notes.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: --features custom-protocol --config tauri.updater.conf.json --config tauri.runtime-bundle.conf.json ${{ matrix.args }}

      - name: Preserve every packaging-tool download attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tauri-downloads-${{ matrix.platform }}
          path: test/out/release-tauri-downloads
          if-no-files-found: warn

      - name: Verify sealed macOS application bundle and packaged resources
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="apps/desktop/tauri/target/aarch64-apple-darwin/release/bundle/macos/OpenCodeX Desktop.app"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1
          test -s "$app/Contents/Resources/resources/LICENSE"
          test -s "$app/Contents/Resources/resources/THIRD-PARTY-NOTICES.txt"
      - name: Package verified macOS app in its independent user installation folder
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          app="apps/desktop/tauri/target/aarch64-apple-darwin/release/bundle/macos/OpenCodeX Desktop.app"
          images=(apps/desktop/tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          test -f "${images[0]}"
          output="test/out/macos023-package/$(basename "${images[0]}")"
          python3 .github/scripts/package_macos_023.py --app "$app" --output "$output" --metadata test/out/macos023-package/package-evidence.json --expected-version 0.2.23 --input-kind release-input
          # The sealed .app/updater bytes stay unchanged; replace only the DMG.
          cp "$output" "${images[0]}"
          gh release upload "$RELEASE_TAG" "$output" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: release-macos-installation-layout-evidence
          path: test/out/macos023-package/package-evidence.json
          if-no-files-found: ignore

      # Keep the release private until its actual installer bytes pass the existing
      # ephemeral-runner checks. This does not replace updater signature validation.
      - name: Prepare disposable Server MSI client-equivalent fixture
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop/tauri
        run: |
          & ../../../test/smoke/windows-msi-server-fixture.ps1 -Mode prepare -EvidenceDirectory ../../../test/out/release-windows-installer

      - name: Verify Windows release installers on isolated runner
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop/tauri
        run: |
          & ../../../test/smoke/windows-installer.ps1 -BundleDirectory target/release/bundle -BuiltExecutable target/release/opencodex-desktop.exe -Node (Get-Command node).Source -OutputDirectory ../../../test/out/release-windows-installer

      - name: Restore exact Server MSI policy
        if: always() && runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop/tauri
        run: if(Test-Path ../../../test/out/release-windows-installer/msi-server-policy.original.json){ & ../../../test/smoke/windows-msi-server-fixture.ps1 -Mode restore -EvidenceDirectory ../../../test/out/release-windows-installer }

      - name: Preserve Windows release installer evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer-evidence
          path: test/out/release-windows-installer
          if-no-files-found: warn

  maintained-runtime:
    needs: release
    if: always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.runtime_only))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Reproduce maintained base and Desktop names runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRUNTIME'
          import hashlib,pathlib,urllib.request
          p=pathlib.Path("test/out/base-runtime.tgz");p.parent.mkdir(parents=True,exist_ok=True)
          with urllib.request.urlopen("https://github.com/gzers/opencodex-desktop/releases/download/v0.2.22/opencodex-2.97.0-post021.ownerquery.2.tgz",timeout=60) as r: data=r.read(32*1024*1024+1)
          assert len(data)<=32*1024*1024 and hashlib.sha256(data).hexdigest()=="bba03ba0cf02c7bcd1895f63c670cb4a2f4b5272657145e45701b20d5e0f1957"
          p.write_bytes(data)
          PYRUNTIME
          python3 .github/scripts/build_runtime_023.py test/out/maintained-runtime --archive test/out/base-runtime.tgz
      - name: Install pinned signing CLI
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: Sign and attach maintained runtime to the same draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tauri signer sign test/out/maintained-runtime/*.tgz
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            test/out/maintained-runtime/*.tgz test/out/maintained-runtime/*.sig \
            test/out/maintained-runtime/maintained-runtime.json \
            test/out/maintained-runtime/maintained-runtime.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintained-runtime-build-evidence
          path: test/out/maintained-runtime
          if-no-files-found: error
