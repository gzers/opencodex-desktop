name: CI

on:
  push:
    branches: [main, docs/governance-main, 'feature/**']
  pull_request:

jobs:
  windows-smoke-evidence:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify Windows process-token evidence and smoke syntax
        shell: pwsh
        run: ./test/smoke/windows-process-token.test.ps1 -OutputDirectory test/out/windows-process-token
      - name: Verify installer matrix completeness and parameter isolation
        shell: pwsh
        run: ./test/smoke/windows-installer-matrix.test.ps1 -OutputDirectory test/out/windows-process-token/installer-matrix
      - name: Verify isolated acceptance Profile admission
        shell: pwsh
        run: ./test/smoke/windows-acceptance-profile.test.ps1 -OutputDirectory test/out/windows-process-token/profile
      - name: Verify ordinary-account first-logon Profile before long builds
        shell: pwsh
        run: |
          $taskPwsh = (Get-Process -Id $PID).Path
          ./test/smoke/windows-ordinary-startup.ps1 -Executable $taskPwsh -Node $taskPwsh -OutputDirectory test/out/windows-process-token/ordinary-profile -ProfileOnly
      - name: Verify recovery restart waits for the old process exit
        shell: pwsh
        run: ./test/smoke/windows-restart-handoff.test.ps1 -OutputDirectory test/out/windows-process-token/restart-handoff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-process-token-evidence
          path: test/out/windows-process-token
          if-no-files-found: error

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: python3 -B -m unittest discover -s test -p 'test_publish_release.py' -v
      - run: python3 -B -m unittest discover -s test -p 'test_package_macos_023.py' -v
      - run: python3 -B -m unittest discover -s test -p 'test_stage_runtime_bundle_023.py' -v
      - run: python3 -B -m unittest discover -s test -p 'test_maintained_runtime.py' -v
      - run: python3 -B -m unittest discover -s test -p 'test_windows_release_acceptance.py' -v
      - run: python3 -B -m unittest discover -s test -p 'test_windows_etw_ci.py' -v
      - run: python3 -B -m unittest discover -s test -p 'test_windows_retention_ci.py' -v

  frontend:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Windows CDP protocol regression
        run: node --test test/smoke/windows-cdp.test.mjs test/smoke/windows-model-ui.test.mjs test/smoke/windows-ota-channel.test.mjs test/smoke/windows-ota-fixture.test.mjs test/smoke/windows-ui-alignment.test.mjs test/smoke/windows-021-probes.test.mjs test/smoke/windows-021-runtime-host.test.mjs test/smoke/windows-021-ready-webdav.test.mjs
      - run: npm --prefix apps/desktop/ui ci
      - name: Install locked Chromium and WebKit for actual dialog pixel tests
        run: npm --prefix apps/desktop/ui exec -- playwright-core install chromium webkit
      - run: npm --prefix apps/desktop/ui run typecheck
      - run: npm --prefix apps/desktop/ui run test -- --run
        env:
          OCXD_GLASS_EVIDENCE_DIR: ${{ runner.temp }}
      - run: npm --prefix apps/desktop/ui run build
      - name: Preserve actual browser pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dialog-pixel-evidence
          path: ${{ runner.temp }}/ocxd023-dialog-glass-*
          if-no-files-found: warn

  backend:
    runs-on: macos-15
    # Cargo 清单在 apps/desktop/tauri/Cargo.toml（仓库根无 Cargo.toml）；cargo 命令必须在
    # apps/desktop/tauri 下执行，否则根目录会以「could not find Cargo.toml」立即失败（DEF-01）。
    defaults:
      run:
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify bounded metadata process tree before the workspace workload
        run: cargo test --locked --lib --features integration-test modules::about::remote::tests::metadata_query_rejects_oversize_and_kills_timed_out_process_group -- --exact
      - name: Run remaining workspace regression without repeating the completed query fixture
        run: cargo test --locked --workspace --features integration-test -- --skip modules::about::remote::tests::metadata_query_rejects_oversize_and_kills_timed_out_process_group

  # Windows 不仅编译：运行后端回归，并启动最终 EXE 检查无 HOME 环境、
  # 隔离数据初始化和 WebView 首屏。该 job 不生成安装器或发布制品。
  backend-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.8.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm --prefix ../ui ci
      - run: npm --prefix ../ui run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Prepare first-regression ETW only on the Windows diagnostic branch
        id: regression-etw
        if: github.repository == 'gzers/opencodex-desktop' && github.run_attempt == 1 && (github.ref == 'refs/heads/feature/0.1.10-windows-query-etw' || github.head_ref == 'feature/0.1.10-windows-query-etw')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python ../../../test/smoke/windows-etw-ci-admit.py --first-regression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskAdmission = Get-Content -LiteralPath ../../../test/out/windows-query-etw/admission.json -Raw | ConvertFrom-Json
          & ../../../test/smoke/windows-owned-etw.test.ps1 `
            -DecoderDirectory $taskAdmission.decoder `
            -TestExecutable $taskAdmission.testExecutable -ExpectedTestSha256 $taskAdmission.testSha256 `
            -Node $taskAdmission.node -ExpectedNodeSha256 $taskAdmission.nodeSha256 `
            -OutputRoot $taskAdmission.outputRoot |
            Tee-Object -FilePath ../../../test/out/windows-query-etw/pure-guards.original.json
          'enabled=true' >> $env:GITHUB_OUTPUT
      - name: Windows backend regression
        shell: pwsh
        run: |
          $env:OPENCODEX_TEST_NODE = (Get-Command node).Source
          [ordered]@{
            logicalProcessors = [Environment]::ProcessorCount
            nodeExecutable = $env:OPENCODEX_TEST_NODE
            tempDirectory = [IO.Path]::GetTempPath()
            rustTestThreads = $env:RUST_TEST_THREADS
            rustTestTimeUnit = $env:RUST_TEST_TIME_UNIT
          } | ConvertTo-Json
          # Preserve the original process deadlines and default test worker count.
          # The diagnostic branch retains its original first-regression capture.
          # Normal workspace binaries run under one new ordinary token/Profile,
          # preserving all tests and libtest's default workers. Elevated creation
          # and native credential groups remain independent always steps below.
          if ('${{ steps.regression-etw.outputs.enabled }}' -ceq 'true') {
            $taskAdmission = Get-Content -LiteralPath ../../../test/out/windows-query-etw/admission.json -Raw | ConvertFrom-Json
            $env:OPENCODEX_TEST_NODE = $taskAdmission.node
            $taskRunner = @((Get-Process -Id $PID).Path,'-NoLogo','-NoProfile','-NonInteractive','-File',
              (Resolve-Path -LiteralPath ../../../test/smoke/windows-ci-test-runner.ps1).Path)
            $taskConfig = "[target.x86_64-pc-windows-msvc]`nrunner = " + (ConvertTo-Json -InputObject $taskRunner -Compress)
            $taskConfigPath = [IO.Path]::GetFullPath('../../../test/out/windows-query-etw/ci-test-runner.toml')
            [IO.File]::WriteAllText($taskConfigPath,$taskConfig,[Text.UTF8Encoding]::new($false))
            foreach ($taskName in @('GITHUB_TOKEN','GH_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
              [Environment]::SetEnvironmentVariable($taskName,$null,'Process')
            }
            cargo --config $taskConfigPath test --locked --workspace --features integration-test -- --show-output
          } else {
            cargo test --locked --workspace --features integration-test --doc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $taskStatic = Join-Path $env:RUNNER_TEMP ('ocxd023-rust-static-' + [guid]::NewGuid().ToString('N'))
            & ../../../test/smoke/windows023-rust-ordinary.test.ps1 -OutputDirectory $taskStatic
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $taskOrdinary = Join-Path $env:RUNNER_TEMP ('ocxd023-rust-ordinary-' + [guid]::NewGuid().ToString('N'))
            try {
              & ../../../test/smoke/windows023-rust-ordinary.ps1 -Cargo (Get-Command cargo.exe).Source -ManifestPath (Join-Path $PWD 'Cargo.toml') -Node (Get-Command node.exe).Source -OutputDirectory $taskOrdinary -ExpectedCommit (git rev-parse HEAD)
              if ($LASTEXITCODE -ne 0) { throw 'Actual ordinary-account workspace binaries failed; original evidence retained' }
            } finally {
              New-Item -ItemType Directory -Force ../../../test/out/windows-backend | Out-Null
              if (Test-Path -LiteralPath $taskOrdinary) { Copy-Item -LiteralPath $taskOrdinary -Destination ../../../test/out/windows-backend/ordinary-rust -Recurse }
              if (Test-Path -LiteralPath $taskStatic) { Copy-Item -LiteralPath $taskStatic -Destination ../../../test/out/windows-backend/ordinary-static -Recurse }
            }
          }
      - name: Verify actual TokenUser ownership at private object creation
        if: always()
        shell: pwsh
        run: |
          cargo test --locked --lib infrastructure::windows_private_create::tests -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify isolated native credential protection
        if: always()
        shell: pwsh
        run: |
          $env:OPENCODEX_SANDBOX = '1'
          cargo test --locked --test provider_auth_native -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test channel_rename_native -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib native_secure_store_round_trip -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify official managed install upgrade and offline reinstall
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../../../test/out/windows-backend | Out-Null
          $env:OPENCODEX_MANAGED_LIVE = '1'
          $env:OPENCODEX_TEST_NODE = (Get-Command node).Source
          $env:OPENCODEX_TEST_NPM = (Get-Command npm.cmd).Source
          $env:OPENCODEX_MANAGED_LIVE_REPORT = [IO.Path]::GetFullPath('../../../test/out/windows-backend/managed-live.json')
          cargo test --locked --test windows_runtime windows_official_managed_registry_upgrade_and_offline_reinstall -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Windows native dependency diagnostics
        if: always()
        shell: pwsh
        run: |
          $outputDirectory = "../../../test/out/windows-backend"
          New-Item -ItemType Directory -Force $outputDirectory | Out-Null
          [ordered]@{
            runner = $env:RUNNER_NAME
            image = $env:ImageOS
            imageVersion = $env:ImageVersion
            os = [System.Environment]::OSVersion.VersionString
            rust = (rustc --version 2>&1 | Out-String).Trim()
            cargo = (cargo --version 2>&1 | Out-String).Trim()
            node = (node --version 2>&1 | Out-String).Trim()
          } | ConvertTo-Json | Set-Content (Join-Path $outputDirectory "environment.json")
          cargo metadata --locked --format-version 1 > (Join-Path $outputDirectory "cargo-metadata.json") 2>&1
          cargo tree --locked > (Join-Path $outputDirectory "cargo-tree.txt") 2>&1
          $testExecutable = Get-ChildItem "target/debug/deps/opencodex_desktop_lib-*.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($testExecutable) {
            Copy-Item $testExecutable.FullName (Join-Path $outputDirectory $testExecutable.Name)
            Get-FileHash $testExecutable.FullName -Algorithm SHA256 |
              ConvertTo-Json | Set-Content (Join-Path $outputDirectory "test-executable-sha256.json")
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $dumpbin = $null
            $mt = $null
            if (Test-Path $vswhere) {
              $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
                Select-Object -First 1
              if ($vsInstall) {
                $dumpbin = Get-ChildItem (Join-Path $vsInstall 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') -ErrorAction SilentlyContinue |
                  Sort-Object FullName | Select-Object -Last 1
              }
            }
            if (-not $dumpbin) { $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue }
            $mt = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\*\x64\mt.exe') -ErrorAction SilentlyContinue |
              Sort-Object FullName | Select-Object -Last 1
            if ($dumpbin) {
              $dumpbinPath = if ($dumpbin.FullName) { $dumpbin.FullName } else { $dumpbin.Source }
              & $dumpbinPath /DEPENDENTS $testExecutable.FullName > (Join-Path $outputDirectory "test-executable-dependents.txt") 2>&1
              & $dumpbinPath /IMPORTS $testExecutable.FullName > (Join-Path $outputDirectory "test-executable-imports.txt") 2>&1
              & $dumpbinPath /HEADERS $testExecutable.FullName > (Join-Path $outputDirectory "test-executable-headers.txt") 2>&1
            } else {
              "dumpbin was not found on PATH" | Set-Content (Join-Path $outputDirectory "dumpbin-unavailable.txt")
            }
            if ($mt) {
              $manifestPath = Join-Path $outputDirectory "test-executable.manifest.xml"
              $resource = "$($testExecutable.FullName);#1"
              & $mt.FullName "-inputresource:$resource" "-out:$manifestPath" > (Join-Path $outputDirectory "test-executable-manifest.txt") 2>&1
            } else {
              "mt.exe was not found in Windows SDK" | Set-Content (Join-Path $outputDirectory "mt-unavailable.txt")
            }
          } else {
            "Windows backend test executable was not produced" | Set-Content (Join-Path $outputDirectory "test-executable-unavailable.txt")
          }
          $webViewLoader = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\EBWebView\x64\EmbeddedBrowserWebView.dll" -ErrorAction SilentlyContinue
          if ($webViewLoader) { $webViewLoader | Select-Object -ExpandProperty FullName | Set-Content (Join-Path $outputDirectory "webview2-runtime-files.txt") }
          Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*" -ErrorAction SilentlyContinue |
            Select-Object name, pv, version | ConvertTo-Json | Set-Content (Join-Path $outputDirectory "webview2-registry.json")
          Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\*" -ErrorAction SilentlyContinue |
            Select-Object name, pv, version | ConvertTo-Json | Add-Content (Join-Path $outputDirectory "webview2-registry.json")
      - run: cargo build --locked --release --features custom-protocol --bins
      - name: Preserve exact MSVC application candidate for native followup
        shell: pwsh
        env:
          OCX_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $taskCandidateDir = [IO.Path]::GetFullPath('../../../test/out/windows-msvc-candidate')
          New-Item -ItemType Directory -Force $taskCandidateDir | Out-Null
          $taskOriginal = (Resolve-Path -LiteralPath target/release/opencodex-desktop.exe).Path
          $taskCopy = Join-Path $taskCandidateDir 'opencodex-desktop.exe'
          Copy-Item -LiteralPath $taskOriginal -Destination $taskCopy
          $taskOriginalHash = (Get-FileHash -LiteralPath $taskOriginal -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $taskCopy -Algorithm SHA256).Hash.ToLowerInvariant() -cne $taskOriginalHash) { throw 'Candidate copy does not match the original build' }
          $taskHost = (rustc -vV | Select-String '^host: ').ToString().Substring(6).Trim()
          if ($taskHost -cne 'x86_64-pc-windows-msvc') { throw 'Candidate is not the expected MSVC build' }
          [ordered]@{
            schemaVersion = 1
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            requestedHead = $env:OCX_CANDIDATE_HEAD
            checkedCommit = (git rev-parse HEAD).Trim()
            appsTree = (git rev-parse HEAD:apps).Trim()
            target = $taskHost
            profile = 'release; custom-protocol'
            executable = 'opencodex-desktop.exe'
            sha256 = $taskOriginalHash
            bytes = (Get-Item -LiteralPath $taskCopy).Length
            scope = 'Native validation candidate only; not an installer, signed updater or release acceptance result'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $taskCandidateDir 'candidate.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-candidate
          path: test/out/windows-msvc-candidate
          if-no-files-found: error
      - name: Windows final EXE smoke
        shell: pwsh
        run: |
          & ../../../test/smoke/windows-ordinary-startup.ps1 -Executable target/release/opencodex-desktop.exe -Node (Get-Command node).Source -OutputDirectory ../../../test/out/windows-startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record Node24 driver for native version matrix
        id: native_driver
        shell: pwsh
        run: '"node=$((Get-Command node).Source)" >> $env:GITHUB_OUTPUT'
      - name: Windows native installation failure, metadata recovery and path regression
        shell: pwsh
        run: |
          $taskNativeNode = (Get-Command node).Source
          $taskNativeNpm = Join-Path (Split-Path -Parent $taskNativeNode) 'node_modules/npm/bin/npm-cli.js'
          & ../../../test/smoke/windows-install-recovery.ps1 -Executable target/release/opencodex-desktop.exe -Node $taskNativeNode -NpmCli $taskNativeNpm -OutputDirectory ../../../test/out/windows-native-018
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
      - name: Windows original Node22.20 npm environment regression
        shell: pwsh
        run: |
          $taskNativeNode = (Get-Command node).Source
          $taskNativeNpm = Join-Path (Split-Path -Parent $taskNativeNode) 'node_modules/npm/bin/npm-cli.js'
          & ../../../test/smoke/windows-install-recovery.ps1 -Executable target/release/opencodex-desktop.exe -Node $taskNativeNode -NpmCli $taskNativeNpm -DriverNode '${{ steps.native_driver.outputs.node }}' -OutputDirectory ../../../test/out/windows-native-018-node22
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Windows ordinary-account final EXE smoke
        shell: pwsh
        run: |
          & ../../../test/smoke/windows-ordinary-startup.ps1 -Executable target/release/opencodex-desktop.exe -Node (Get-Command node).Source -OutputDirectory ../../../test/out/windows-ordinary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-evidence
          path: |
            test/out/windows-startup
            test/out/windows-backend
            test/out/windows-native-018
            test/out/windows-native-018-node22
            test/out/windows-ordinary
            test/out/windows-query-etw
            test/runtime/ci-bd2-query-etw/capture
            !test/out/windows-native-018/OpenCodeX Native*/**
            !test/out/windows-native-018-node22/OpenCodeX Native*/**
            !test/out/windows-startup/**/sandbox-*/**
            !test/out/windows-ordinary/**/sandbox-*/**

  build:
    if: github.ref == 'refs/heads/main'
    needs: [frontend, backend, backend-windows, release-tools, windows-smoke-evidence]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: Install frontend deps (build job installs its own, not relying on frontend job)
        run: npm --prefix apps/desktop/ui ci
      - name: Build macOS arm64 bundle
        # tauri.conf.json 在 apps/desktop/tauri（仓库根没有），必须在应用目录里执行 CLI，
        # 否则根目录直接以「could not find tauri.conf.json」失败（IMP-03 目录迁移后遗留）。
        working-directory: apps/desktop/tauri
        run: tauri build --features custom-protocol --target aarch64-apple-darwin
