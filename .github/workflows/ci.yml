name: CI

on:
  push:
    branches: [main, docs/governance-main, 'feature/**']
  pull_request:

jobs:
  windows-smoke-evidence:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify Windows process-token evidence and smoke syntax
        shell: pwsh
        run: ./test/smoke/windows-process-token.test.ps1 -OutputDirectory test/out/windows-process-token
      - name: Verify isolated acceptance Profile admission
        shell: pwsh
        run: ./test/smoke/windows-acceptance-profile.test.ps1 -OutputDirectory test/out/windows-process-token/profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-process-token-evidence
          path: test/out/windows-process-token
          if-no-files-found: error

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: python3 -B -m unittest discover -s test -p 'test_publish_release.py' -v
      - run: python3 -B -m unittest discover -s test -p 'test_windows_etw_ci.py' -v

  frontend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Windows CDP protocol regression
        run: node --test test/smoke/windows-cdp.test.mjs
      - run: npm --prefix apps/desktop/ui ci
      - run: npm --prefix apps/desktop/ui run typecheck
      - run: npm --prefix apps/desktop/ui run test -- --run
      - run: npm --prefix apps/desktop/ui run build

  backend:
    runs-on: macos-14
    # Cargo 清单在 apps/desktop/tauri/Cargo.toml（仓库根无 Cargo.toml）；cargo 命令必须在
    # apps/desktop/tauri 下执行，否则根目录会以「could not find Cargo.toml」立即失败（DEF-01）。
    defaults:
      run:
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --features integration-test

  # Windows 不仅编译：运行后端回归，并启动最终 EXE 检查无 HOME 环境、
  # 隔离数据初始化和 WebView 首屏。该 job 不生成安装器或发布制品。
  backend-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm --prefix ../ui ci
      - run: npm --prefix ../ui run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Prepare first-regression ETW only on the Windows diagnostic branch
        id: regression-etw
        if: github.repository == 'gzers/opencodex-desktop' && github.run_attempt == 1 && (github.ref == 'refs/heads/feature/0.1.10-windows-query-etw' || github.head_ref == 'feature/0.1.10-windows-query-etw')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python ../../../test/smoke/windows-etw-ci-admit.py --first-regression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskAdmission = Get-Content -LiteralPath ../../../test/out/windows-query-etw/admission.json -Raw | ConvertFrom-Json
          & ../../../test/smoke/windows-owned-etw.test.ps1 `
            -DecoderDirectory $taskAdmission.decoder `
            -TestExecutable $taskAdmission.testExecutable -ExpectedTestSha256 $taskAdmission.testSha256 `
            -Node $taskAdmission.node -ExpectedNodeSha256 $taskAdmission.nodeSha256 `
            -OutputRoot $taskAdmission.outputRoot |
            Tee-Object -FilePath ../../../test/out/windows-query-etw/pure-guards.original.json
          'enabled=true' >> $env:GITHUB_OUTPUT
      - name: Windows backend regression
        shell: pwsh
        run: |
          $env:OPENCODEX_TEST_NODE = (Get-Command node).Source
          [ordered]@{
            logicalProcessors = [Environment]::ProcessorCount
            nodeExecutable = $env:OPENCODEX_TEST_NODE
            tempDirectory = [IO.Path]::GetTempPath()
            rustTestThreads = $env:RUST_TEST_THREADS
            rustTestTimeUnit = $env:RUST_TEST_TIME_UNIT
          } | ConvertTo-Json
          # Print captured fixture phases after execution, including successful
          # cases, without changing test parallelism or production deadlines.
          if ('${{ steps.regression-etw.outputs.enabled }}' -ceq 'true') {
            $taskAdmission = Get-Content -LiteralPath ../../../test/out/windows-query-etw/admission.json -Raw | ConvertFrom-Json
            $env:OPENCODEX_TEST_NODE = $taskAdmission.node
            $taskRunner = @((Get-Process -Id $PID).Path,'-NoLogo','-NoProfile','-NonInteractive','-File',
              (Resolve-Path -LiteralPath ../../../test/smoke/windows-ci-test-runner.ps1).Path)
            $taskConfig = "[target.x86_64-pc-windows-msvc]`nrunner = " + (ConvertTo-Json -InputObject $taskRunner -Compress)
            $taskConfigPath = [IO.Path]::GetFullPath('../../../test/out/windows-query-etw/ci-test-runner.toml')
            [IO.File]::WriteAllText($taskConfigPath,$taskConfig,[Text.UTF8Encoding]::new($false))
            foreach ($taskName in @('GITHUB_TOKEN','GH_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
              [Environment]::SetEnvironmentVariable($taskName,$null,'Process')
            }
            cargo --config $taskConfigPath test --locked --workspace --features integration-test -- --show-output
          } else {
            cargo test --locked --workspace --features integration-test -- --show-output
          }
      - name: Collect Windows native dependency diagnostics
        if: always()
        shell: pwsh
        run: |
          $outputDirectory = "../../../test/out/windows-backend"
          New-Item -ItemType Directory -Force $outputDirectory | Out-Null
          [ordered]@{
            runner = $env:RUNNER_NAME
            image = $env:ImageOS
            imageVersion = $env:ImageVersion
            os = [System.Environment]::OSVersion.VersionString
            rust = (rustc --version 2>&1 | Out-String).Trim()
            cargo = (cargo --version 2>&1 | Out-String).Trim()
            node = (node --version 2>&1 | Out-String).Trim()
          } | ConvertTo-Json | Set-Content (Join-Path $outputDirectory "environment.json")
          cargo metadata --locked --format-version 1 > (Join-Path $outputDirectory "cargo-metadata.json") 2>&1
          cargo tree --locked > (Join-Path $outputDirectory "cargo-tree.txt") 2>&1
          $testExecutable = Get-ChildItem "target/debug/deps/opencodex_desktop_lib-*.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($testExecutable) {
            Copy-Item $testExecutable.FullName (Join-Path $outputDirectory $testExecutable.Name)
            Get-FileHash $testExecutable.FullName -Algorithm SHA256 |
              ConvertTo-Json | Set-Content (Join-Path $outputDirectory "test-executable-sha256.json")
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $dumpbin = $null
            $mt = $null
            if (Test-Path $vswhere) {
              $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
                Select-Object -First 1
              if ($vsInstall) {
                $dumpbin = Get-ChildItem (Join-Path $vsInstall 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') -ErrorAction SilentlyContinue |
                  Sort-Object FullName | Select-Object -Last 1
              }
            }
            if (-not $dumpbin) { $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue }
            $mt = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\*\x64\mt.exe') -ErrorAction SilentlyContinue |
              Sort-Object FullName | Select-Object -Last 1
            if ($dumpbin) {
              $dumpbinPath = if ($dumpbin.FullName) { $dumpbin.FullName } else { $dumpbin.Source }
              & $dumpbinPath /DEPENDENTS $testExecutable.FullName > (Join-Path $outputDirectory "test-executable-dependents.txt") 2>&1
              & $dumpbinPath /IMPORTS $testExecutable.FullName > (Join-Path $outputDirectory "test-executable-imports.txt") 2>&1
              & $dumpbinPath /HEADERS $testExecutable.FullName > (Join-Path $outputDirectory "test-executable-headers.txt") 2>&1
            } else {
              "dumpbin was not found on PATH" | Set-Content (Join-Path $outputDirectory "dumpbin-unavailable.txt")
            }
            if ($mt) {
              $manifestPath = Join-Path $outputDirectory "test-executable.manifest.xml"
              $resource = "$($testExecutable.FullName);#1"
              & $mt.FullName "-inputresource:$resource" "-out:$manifestPath" > (Join-Path $outputDirectory "test-executable-manifest.txt") 2>&1
            } else {
              "mt.exe was not found in Windows SDK" | Set-Content (Join-Path $outputDirectory "mt-unavailable.txt")
            }
          } else {
            "Windows backend test executable was not produced" | Set-Content (Join-Path $outputDirectory "test-executable-unavailable.txt")
          }
          $webViewLoader = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\EBWebView\x64\EmbeddedBrowserWebView.dll" -ErrorAction SilentlyContinue
          if ($webViewLoader) { $webViewLoader | Select-Object -ExpandProperty FullName | Set-Content (Join-Path $outputDirectory "webview2-runtime-files.txt") }
          Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*" -ErrorAction SilentlyContinue |
            Select-Object name, pv, version | ConvertTo-Json | Set-Content (Join-Path $outputDirectory "webview2-registry.json")
          Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\*" -ErrorAction SilentlyContinue |
            Select-Object name, pv, version | ConvertTo-Json | Add-Content (Join-Path $outputDirectory "webview2-registry.json")
      - run: cargo build --locked --release --features custom-protocol --bins
      - name: Windows final EXE smoke
        shell: pwsh
        run: |
          & ../../../test/smoke/windows-startup.ps1 -Executable target/release/opencodex-desktop.exe -Node (Get-Command node).Source -OutputDirectory ../../../test/out/windows-startup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-evidence
          path: |
            test/out/windows-startup
            test/out/windows-backend
            test/out/windows-query-etw
            test/runtime/ci-bd2-query-etw/capture

  build:
    if: github.ref == 'refs/heads/main'
    needs: [frontend, backend, backend-windows, release-tools, windows-smoke-evidence]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: Install frontend deps (build job installs its own, not relying on frontend job)
        run: npm --prefix apps/desktop/ui ci
      - name: Build macOS arm64 bundle
        # tauri.conf.json 在 apps/desktop/tauri（仓库根没有），必须在应用目录里执行 CLI，
        # 否则根目录直接以「could not find tauri.conf.json」失败（IMP-03 目录迁移后遗留）。
        working-directory: apps/desktop/tauri
        run: tauri build --target aarch64-apple-darwin
