[package]
name = "windows024-native-proof"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

# Standalone proof compiles the actual platform module; no Tauri build/parent registration.
[workspace]

[dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[lib]
path = "lib.rs"

[[bin]]
name = "native024-fixture"
path = "fixture.rs"
