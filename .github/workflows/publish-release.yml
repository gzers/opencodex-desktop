name: Publish Release

# publish/v* 仅公开已有制品并保留 Latest；稳定通道晋升须手动明确选择 stable。
# 不重新构建、不修改历史 tag，不把发布凭据放到本机。
on:
  push:
    tags: ['publish/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本 tag（如 v0.1.6）'
        required: true
        type: string
      mode:
        description: '仅公开并保留 Latest，或将目标版本投递到稳定通道'
        required: true
        type: choice
        default: preserve-latest
        options: [preserve-latest, stable]

permissions:
  contents: write

concurrency:
  group: publish-release-channel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 公开版本并验证所选通道
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISH_MODE: ${{ inputs.mode || 'preserve-latest' }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME#publish/}}"
          python3 .github/scripts/publish_release.py "$tag" \
            --repo "$GITHUB_REPOSITORY" --mode "$PUBLISH_MODE" 2>&1 | tee /tmp/publish-diag.txt

      # 失败也公开诊断，但不掩盖上一发布步骤的退出码。
      - name: 公开诊断结果
        if: always()
        run: |
          set -euo pipefail
          cp /tmp/publish-diag.txt publish-diag.txt
          git config user.name "opencodex-ci"
          git config user.email "ci@opencodex.invalid"
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f publish-diag.txt
          git commit -m "ci: publish 诊断 (${{ github.run_id }})" >/dev/null
          git push --force origin ci-logs
