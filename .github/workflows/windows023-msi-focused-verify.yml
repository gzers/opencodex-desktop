name: Windows isolated MSI focused verification
on:
  workflow_call:
    inputs:
      build_run:
        type: string
        required: true
      source:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.8.1
      - name: Verify exact existing installer source and run before download
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          SOURCE: ${{ inputs.source }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:SOURCE -cnotmatch '^[a-f0-9]{40}$' -or $env:BUILD_RUN -notmatch '^[0-9]+$' -or $env:ARTIFACT_ID -notmatch '^[0-9]+$'){throw 'Explicit source/run/artifact required'}
          $headers=@{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json'}
          $run=Invoke-RestMethod -Uri ('https://api.github.com/repos/gzers/opencodex-desktop/actions/runs/'+$env:BUILD_RUN) -Headers $headers
          if($run.head_sha -cne $env:SOURCE -or $run.conclusion -cne 'success'){throw 'Original package build not successful or wrong source'}
          $a=Invoke-RestMethod -Uri ('https://api.github.com/repos/gzers/opencodex-desktop/actions/artifacts/'+$env:ARTIFACT_ID) -Headers $headers
          if($a.expired -or $a.workflow_run.id.ToString() -cne $env:BUILD_RUN -or $a.workflow_run.head_sha -cne $env:SOURCE -or $a.name -cne ('windows023-installers-program-'+$env:SOURCE)){throw 'Exact source-bound installer artifact required'}
          New-Item -ItemType Directory -Path test/out/msi-focused|Out-Null
          @{artifact=$a;build=@{id=$run.id;head_sha=$run.head_sha;conclusion=$run.conclusion};harness=(git rev-parse HEAD).Trim()}|ConvertTo-Json -Depth 10|Set-Content test/out/msi-focused/input-identity.json -Encoding utf8
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: gzers/opencodex-desktop
          run-id: ${{ inputs.build_run }}
          artifact-ids: ${{ inputs.artifact_id }}
          merge-multiple: true
          path: test/out/msi-focused/input
      - name: Verify all raw package members and product tree
        env:
          SOURCE: ${{ inputs.source }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          $ErrorActionPreference='Stop'
          $inputRoot=[IO.Path]::GetFullPath('test/out/msi-focused/input')
          $m=Get-Content -LiteralPath (Join-Path $inputRoot 'installer-build.json') -Raw|ConvertFrom-Json
          if($m.source -cne $env:SOURCE -or $m.run -cne $env:BUILD_RUN -or $m.appsTree -cne (git rev-parse HEAD:apps).Trim() -or $m.runtimeVersion -cne '2.97.0-desktop023.lifecycle.3'){throw 'Original product source/resources differ'}
          foreach($f in $m.files){$p=Join-Path $inputRoot $f.name;if((Get-Item -LiteralPath $p).Length -ne $f.bytes -or (Get-FileHash -LiteralPath $p).Hash -ine $f.sha256){throw 'Raw installer member differs'}}
          $task=Join-Path $env:RUNNER_TEMP ('ocxd-msi-focused-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $task){throw 'Fresh batch required'}
          New-Item -ItemType Directory -Path $task|Out-Null
          'OCXD_MSI_FOCUSED_ROOT='+$task >> $env:GITHUB_ENV
      - name: Prepare disposable Server client-equivalent MSI policy
        run: ./test/smoke/windows-msi-server-fixture.ps1 -Mode prepare -EvidenceDirectory test/out/msi-focused
      - name: Verify only MSI as its real ordinary installation owner
        run: |
          $ErrorActionPreference='Stop'
          & ./test/smoke/windows023-local-installer.ps1 -Directory $env:OCXD_MSI_FOCUSED_ROOT -BundleDirectory ([IO.Path]::GetFullPath('test/out/msi-focused/input')) -Node (Get-Command node.exe).Source -Kind msi
          $control=Get-Content -LiteralPath (Join-Path $env:OCXD_MSI_FOCUSED_ROOT 'controller-finished.json') -Raw|ConvertFrom-Json
          $actual=Get-Content -LiteralPath (Join-Path $env:OCXD_MSI_FOCUSED_ROOT 'owner/installer-finished.json') -Raw|ConvertFrom-Json
          if(!$actual.passed -or $actual.cells.Count -ne 2 -or !$control.accountRemoved -or !$control.profileRemoved -or !$control.userDirectoryRemoved -or !$control.desktopAclRestored -or !$control.bundleRootAclRestored -or $control.identityUnproven -or $control.residualProcesses.Count){throw 'Focused MSI verification or exact cleanup failed; original evidence retained'}
      - name: Restore exact original disposable Server policy
        if: always()
        run: if(Test-Path test/out/msi-focused/msi-server-policy.original.json){ & ./test/smoke/windows-msi-server-fixture.ps1 -Mode restore -EvidenceDirectory test/out/msi-focused }
      - name: Preserve bounded evidence only
        if: always()
        run: |
          if($env:OCXD_MSI_FOCUSED_ROOT -and (Test-Path -LiteralPath $env:OCXD_MSI_FOCUSED_ROOT)){Copy-Item -LiteralPath $env:OCXD_MSI_FOCUSED_ROOT -Destination test/out/msi-focused/evidence -Recurse}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows023-msi-focused-evidence-${{ github.run_id }}
          path: |
            test/out/msi-focused/*.json
            test/out/msi-focused/evidence/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
