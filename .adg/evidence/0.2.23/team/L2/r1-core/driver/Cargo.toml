[package]
name = "ocxd-sync-v2-core-driver"
version = "0.0.0"
edition = "2021"
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1.89"
tempfile = "3"
libc = "0.2"
