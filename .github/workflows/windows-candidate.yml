name: Windows candidate installer

on:
  push:
    branches: [feature/0.1.8-windows-package, feature/0.1.9-windows-appearance, feature/0.1.10-maintenance]
  workflow_dispatch:
    inputs:
      purpose:
        description: Package a candidate, or run one bounded diagnostic without a desktop/package
        type: choice
        options: [candidate, ordinary-preflight, retention023, query-etw, installer-retention, native-ui, process-exit]
        default: candidate
      admission_run:
        description: Successful exact-head push CI run required for query-etw
        type: string
        default: ''
      diagnostic_path:
        description: Original artifact replay, or one first execution after normal build on runner TEMP volume
        type: choice
        options: [isolated-replay, post-build-runner-temp]
        default: isolated-replay
      candidate_run:
        description: Exact successful 023 candidate run
        type: string
        default: ''
      candidate_attempt:
        description: Exact successful candidate attempt
        type: string
        default: ''
      candidate_head:
        description: Full candidate source SHA
        type: string
        default: ''
      artifact_id:
        description: Exact installer artifact ID
        type: string
        default: ''
      artifact_bytes:
        description: Artifact ZIP byte size
        type: string
        default: ''
      artifact_sha256:
        description: Artifact ZIP SHA256
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || inputs.purpose == 'candidate'
    runs-on: windows-latest
    # Full offline closure, MSVC debug/release builds and actual two-user
    # services share this job. Product start/stop and smoke deadlines stay fixed.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - name: Read candidate version
        id: identity
        run: |
          $taskVersion = (Get-Content -LiteralPath tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($taskVersion -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid candidate version' }
          "version=$taskVersion" >> $env:GITHUB_OUTPUT
      - name: Verify process-token evidence and all Windows smoke syntax
        run: |
          & ../../../test/smoke/windows-process-token.test.ps1 -OutputDirectory ../../../test/out/windows-candidate/process-token
      - uses: actions/setup-node@v5
        with:
          # Bundle resolution must use the same Node/npm pair as the pinned closure.
          node-version: 26.8.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify strict bundle identity checks
        run: |
          node --test ../../../test/smoke/windows-bundle-identity.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri -> target
          cache-on-failure: true
      - name: Install pinned CLI and frontend
        run: |
          npm install --global @tauri-apps/cli@2.11.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix ../ui ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix ../ui run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Produce the complete 0.2.23 closure before compilation, matching release pins.
      - name: Stage complete 0.2.23 offline runtime
        if: steps.identity.outputs.version == '0.2.23'
        run: |
          $taskNode = (Get-Command node).Source
          $taskNpm = node -e 'const p=require("node:path"),f=require("node:fs"),d=p.dirname(process.execPath);const a=[p.join(d,"node_modules/npm/bin/npm-cli.js"),p.join(d,"../lib/node_modules/npm/bin/npm-cli.js")];const n=a.find(x=>f.existsSync(x));if(!n)process.exit(1);process.stdout.write(p.resolve(n))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../../../.github/scripts/stage_runtime_bundle_023.py --platform win32-x64 --build-node $taskNode --npm-cli $taskNpm --output ../../../test/out/windows-candidate/runtime-stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'OCXD_REQUIRE_RUNTIME_BUNDLE=1' >> $env:GITHUB_ENV
      - name: Freeze and record dependency resolution
        run: |
          New-Item -ItemType Directory -Force ../../../test/out/windows-candidate | Out-Null
          Copy-Item Cargo.lock ../../../test/out/windows-candidate/Cargo.lock
          cargo metadata --locked --format-version 1 > ../../../test/out/windows-candidate/cargo-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo tree --locked > ../../../test/out/windows-candidate/cargo-tree.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{ source = (git rev-parse HEAD); runner = $env:ImageOS; image = $env:ImageVersion; rust = (rustc --version); cargo = (cargo --version); node = (node --version); npm = (npm --version); tauri = (tauri --version) } | ConvertTo-Json | Set-Content ../../../test/out/windows-candidate/environment.json
      - name: Windows regression with the package lock
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OPENCODEX_TEST_NODE = (Get-Command node).Source
          cargo test --locked --workspace --features integration-test --doc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskStatic = Join-Path $env:RUNNER_TEMP ('ocxd023-rust-static-' + [guid]::NewGuid().ToString('N'))
          & ../../../test/smoke/windows023-rust-ordinary.test.ps1 -OutputDirectory $taskStatic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskOrdinary = Join-Path $env:RUNNER_TEMP ('ocxd023-rust-ordinary-' + [guid]::NewGuid().ToString('N'))
          try {
            & ../../../test/smoke/windows023-rust-ordinary.ps1 -Cargo (Get-Command cargo.exe).Source -ManifestPath (Join-Path $PWD 'Cargo.toml') -Node (Get-Command node.exe).Source -OutputDirectory $taskOrdinary -ExpectedCommit (git rev-parse HEAD)
            if ($LASTEXITCODE -ne 0) { throw 'Actual ordinary-account workspace binaries failed; original evidence retained' }
          } finally {
            if (Test-Path -LiteralPath $taskOrdinary) { Copy-Item -LiteralPath $taskOrdinary -Destination ../../../test/out/windows-candidate/ordinary-rust -Recurse }
            if (Test-Path -LiteralPath $taskStatic) { Copy-Item -LiteralPath $taskStatic -Destination ../../../test/out/windows-candidate/ordinary-static -Recurse }
          }
      - name: Preserve elevated private creation boundary
        if: always()
        run: |
          cargo test --locked --lib infrastructure::windows_private_create::tests -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib modules::backup::manager::tests::windows_backup_lock_uses_actual_token_user_and_reopens_without_repair -- --exact --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native credential protection evidence
        if: always()
        run: |
          $env:OPENCODEX_SANDBOX = '1'
          cargo test --locked --test provider_auth_native -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test channel_rename_native -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib native_secure_store_round_trip -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build NSIS and MSI candidates
        run: |
          # The npm PowerShell shim consumes the standalone -- separator.
          # Invoke its JavaScript entry through the native node executable.
          $taskTauriCli = Join-Path (npm root --global) '@tauri-apps/cli/tauri.js'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskBuildArgs = @('build','--features','custom-protocol','--bundles','nsis,msi')
          if ((Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version -ceq '0.2.23') {
            $taskBuildArgs += @('--config','tauri.runtime-bundle.conf.json')
          }
          $taskBuildArgs += @('--','--locked')
          node $taskTauriCli @taskBuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, verify final EXE and uninstall on isolated runner
        run: |
          & ../../../test/smoke/windows-installer.ps1 -BundleDirectory target/release/bundle -BuiltExecutable target/release/opencodex-desktop.exe -Node (Get-Command node).Source -OutputDirectory ../../../test/out/windows-candidate
      - name: Stage exact complete program for two real user accounts
        if: steps.identity.outputs.version == '0.2.23'
        run: |
          cargo build --locked --release --bin ocxd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskCandidate = Join-Path $env:RUNNER_TEMP ('ocxd023-two-user-candidate-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $taskCandidate | Out-Null
          Copy-Item -LiteralPath target/release/opencodex-desktop.exe -Destination $taskCandidate
          Copy-Item -LiteralPath target/release/ocxd.exe -Destination $taskCandidate
          Copy-Item -LiteralPath resources/runtime-bundle -Destination $taskCandidate -Recurse
          'OCXD_TWO_USER_CANDIDATE='+$taskCandidate >> $env:GITHUB_ENV
          $taskDriver = Join-Path $env:RUNNER_TEMP ('ocxd023-two-user-node-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $taskDriver | Out-Null
          $taskTar = (Get-ChildItem -LiteralPath ../../../test/out/windows-candidate/runtime-stage/platform-bundle -Filter 'runtime-bundle-0.2.23-win32-x64.tar.gz').FullName
          tar -xzf $taskTar -C $taskDriver runtime/node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'OCXD_TWO_USER_NODE='+(Join-Path $taskDriver 'runtime/node/node.exe') >> $env:GITHUB_ENV
      - name: Verify two-user runner guard and fixture contracts
        if: steps.identity.outputs.version == '0.2.23'
        run: |
          $taskOutput = Join-Path $env:RUNNER_TEMP ('ocxd023-two-user-static-'+[guid]::NewGuid().ToString('N'))
          & ../../../test/smoke/windows023-two-user-native.test.ps1 -OutputDirectory $taskOutput -Node $env:OCXD_TWO_USER_NODE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $taskOutput -Destination ../../../test/out/windows-candidate/two-user-static -Recurse
      - name: Verify simultaneous real SID managers and actual runtime ports
        if: steps.identity.outputs.version == '0.2.23'
        run: |
          $taskOutput = Join-Path $env:RUNNER_TEMP ('ocxd023-two-user-native-'+[guid]::NewGuid().ToString('N'))
          try {
            & ../../../test/smoke/windows023-two-user-native.ps1 -Executable (Join-Path $env:OCXD_TWO_USER_CANDIDATE 'opencodex-desktop.exe') -Node $env:OCXD_TWO_USER_NODE -OutputDirectory $taskOutput -ExpectedCommit (git rev-parse HEAD) -VerifyRuntimePorts
            if ($LASTEXITCODE -ne 0) { throw 'Two actual SID native acceptance failed; original evidence retained' }
            $taskTwoUser = Get-Content -LiteralPath (Join-Path $taskOutput 'two-user-native.json') -Raw | ConvertFrom-Json
            if (!$taskTwoUser.fullVersionGatePassed -or $taskTwoUser.runtimeProxyPortIsolation -cne 'verified-runtime-ports') { throw 'Actual runtime-port acceptance is incomplete' }
          } finally {
            if (Test-Path -LiteralPath $taskOutput) { Copy-Item -LiteralPath $taskOutput -Destination ../../../test/out/windows-candidate/two-user-native -Recurse }
          }
      - name: Upload verified Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: opencodex-desktop-${{ steps.identity.outputs.version }}-windows-x64-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/tauri/target/release/bundle/msi/*.msi
            test/out/windows-candidate/installer-verification.json
      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            test/out/windows-candidate/*.json
            test/out/windows-candidate/*.log
            test/out/windows-candidate/ordinary-rust
            test/out/windows-candidate/ordinary-static
            test/out/windows-candidate/runtime-stage/*.json
            test/out/windows-candidate/*-startup/*.json
            test/out/windows-candidate/*-startup/*.log
            test/out/windows-candidate/*-startup/startup/*.json
            test/out/windows-candidate/*-startup/startup/*.log
            test/out/windows-candidate/*-startup/startup/*.png
            test/out/windows-candidate/two-user-native/*.json
            test/out/windows-candidate/two-user-native/*.log
            test/out/windows-candidate/two-user-static

  query-etw:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'query-etw' && github.repository == 'gzers/opencodex-desktop'
    runs-on: windows-latest
    # Build preparation needs its normal CI budget. The original library still
    # has the unchanged 120s outer capture and 2/4/5/8s fixture deadlines.
    timeout-minutes: ${{ inputs.diagnostic_path == 'post-build-runner-temp' && 45 || 15 }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Admit exact-head CI, original failed bd2 artifact and pinned offline dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODEX_ETW_ADMISSION_RUN: ${{ inputs.admission_run }}
          OPENCODEX_ETW_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_path || 'isolated-replay' }}
        run: python test/smoke/windows-etw-ci-admit.py
      - name: Verify collector guards without starting the original library or Node
        shell: pwsh
        run: |
          $taskAdmission = Get-Content -LiteralPath test/out/windows-query-etw/admission.json -Raw | ConvertFrom-Json
          $taskNodeSignature = Get-AuthenticodeSignature -LiteralPath $taskAdmission.node
          if ($taskNodeSignature.Status -ne 'Valid' -or $taskNodeSignature.SignerCertificate.Subject -notlike '*OpenJS*') {
            throw 'Pinned official Node signature is not valid'
          }
          & test/smoke/windows-owned-etw.test.ps1 `
            -DecoderDirectory $taskAdmission.decoder `
            -TestExecutable $taskAdmission.testExecutable -ExpectedTestSha256 $taskAdmission.testSha256 `
            -Node $taskAdmission.node -ExpectedNodeSha256 $taskAdmission.nodeSha256 `
            -OutputRoot $taskAdmission.outputRoot |
            Tee-Object -FilePath test/out/windows-query-etw/pure-guards.original.json
      - uses: actions/setup-node@v5
        if: inputs.diagnostic_path == 'post-build-runner-temp'
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@1.99.0
        if: inputs.diagnostic_path == 'post-build-runner-temp'
        with:
          components: rustfmt, clippy
      - name: Prepare the original regression build stage without running a test
        if: inputs.diagnostic_path == 'post-build-runner-temp'
        shell: pwsh
        working-directory: apps/desktop/tauri
        run: |
          $taskStarted = [datetimeoffset]::UtcNow.ToString('o')
          # These are the ordinary pre-test build steps, not a CPU/disk stress
          # loop. The admitted original test EXE and Node are not launched here.
          npm --prefix ../ui ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix ../ui run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --features integration-test --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{
            startedAtUtc = $taskStarted
            finishedAtUtc = [datetimeoffset]::UtcNow.ToString('o')
            source = (git rev-parse HEAD).Trim()
            applicationTree = (git rev-parse HEAD:apps/desktop).Trim()
            logicalProcessors = [Environment]::ProcessorCount
            runnerTemporaryDirectory = [IO.Path]::GetTempPath()
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            rust = (rustc --version)
            diagnosticPath = 'post-build-runner-temp'
            originalArtifactOrNodeExecutedDuringBuild = $false
            originalLibraryRunsAllowed = 1
            originalFixtureDeadlinesChanged = $false
            artificialStressOrPrewarm = $false
            exactHistoricalEnvironmentReproduced = $false
          } | ConvertTo-Json | Set-Content ../../../test/out/windows-query-etw/post-build-context.original.json
      - name: Record one original unfiltered library run with owned-family ETW
        shell: pwsh
        run: |
          $taskAdmission = Get-Content -LiteralPath test/out/windows-query-etw/admission.json -Raw | ConvertFrom-Json
          $taskRunnerEnvironment = $taskAdmission.diagnosticPath -ceq 'post-build-runner-temp'
          if ($taskRunnerEnvironment) {
            $taskBuild = Get-Content -LiteralPath test/out/windows-query-etw/post-build-context.original.json -Raw | ConvertFrom-Json
            if ($taskBuild.source -cne $taskAdmission.collectorSource -or
                $taskBuild.applicationTree -cne $taskAdmission.applicationTree -or
                $taskBuild.originalArtifactOrNodeExecutedDuringBuild -or $taskBuild.artificialStressOrPrewarm) {
              throw 'Post-build condition admission failed before original test execution'
            }
          }
          # No original test deadline, parallelism, assertion, or collector
          # scope is changed. Do not let a CI credential enter the child.
          foreach ($taskName in @('GITHUB_TOKEN','GH_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
            [Environment]::SetEnvironmentVariable($taskName, $null, 'Process')
          }
          & test/smoke/windows-owned-etw.ps1 `
            -DecoderDirectory $taskAdmission.decoder `
            -TestExecutable $taskAdmission.testExecutable -ExpectedTestSha256 $taskAdmission.testSha256 `
            -Node $taskAdmission.node -ExpectedNodeSha256 $taskAdmission.nodeSha256 `
            -OutputRoot $taskAdmission.outputRoot -RecordApproved -RunnerRegressionEnvironment:$taskRunnerEnvironment |
            Tee-Object -FilePath test/out/windows-query-etw/invocation.original.json
          $taskCapture = Get-Content -LiteralPath (Join-Path $taskAdmission.outputRoot 'capture/capture-result.json') -Raw | ConvertFrom-Json
          if (!$taskCapture.originalLibraryCompleted -or !$taskCapture.ownedRootExited -or
              !$taskCapture.rootProcessStartSeen -or !$taskCapture.processTraceJoined -or
              !$taskCapture.writerJoined -or !$taskCapture.ownedSessionStopSucceeded -or
              !$taskCapture.serializedBytesWithinLimit -or $taskCapture.droppedRecords -ne 0 -or
              $taskCapture.kernelEventsLost -ne 0 -or $taskCapture.decoderCallbackErrors -ne 0 -or
              $taskCapture.nativeOwnedSessionStop.Status -ne 0 -or
              $taskCapture.nativeOwnedSessionStop.FinalEventsLost -ne 0 -or
              $taskCapture.nativeOwnedSessionStop.FinalRealTimeBuffersLost -ne 0 -or
              $taskCapture.knownImageCoverageGap -or $taskCapture.captureError -or $taskCapture.runError -or
              $taskCapture.writerError -or $taskCapture.cleanupErrors.Count -ne 0) {
            throw 'Bounded capture incomplete; original records retained, no automatic retry'
          }
          if ($taskCapture.testExitCode -ne 0) {
            throw "Original library exit $($taskCapture.testExitCode); failure retained, not a version acceptance"
          }
      - name: Preserve diagnostic evidence including failure and partial cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-query-etw-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            test/out/windows-query-etw
            test/runtime/ci-bd2-query-etw/capture

  retention:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'installer-retention' && !startsWith(inputs.admission_run, '{"mode":"retention023"') && github.repository == 'gzers/opencodex-desktop'
    strategy:
      fail-fast: false
      matrix:
        kind: [msi, nsis]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Admit exact harness CI, official 019 and fixed 431 candidate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODEX_RETENTION_ADMISSION_RUN: ${{ inputs.admission_run }}
        run: python test/smoke/windows-retention-ci-admit.py ${{ matrix.kind }}
      - name: Verify installer scope without installation
        shell: pwsh
        run: ./test/smoke/windows-installer-retention.ps1 -AdmissionPath test/out/windows-installer-retention/admission.json
      - name: Install 019, upgrade, verify default-uninstall and reinstall retention
        shell: pwsh
        run: |
          foreach ($taskName in @('GITHUB_TOKEN','GH_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
            [Environment]::SetEnvironmentVariable($taskName,$null,'Process')
          }
          ./test/smoke/windows-installer-retention.ps1 -AdmissionPath test/out/windows-installer-retention/admission.json -Execute
      - name: Preserve successful or failed retention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-retention-${{ matrix.kind }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: test/out/windows-installer-retention

  native-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'native-ui' && inputs.admission_run != 'ordinary-preflight-023' && inputs.admission_run != 'msi-compiler-023' && inputs.admission_run != 'native-replay-414'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri -> target
          shared-key: windows-native-ui-018
          cache-on-failure: true
      - name: Build exact production frontend and isolated native debug image
        run: |
          npm --prefix ../ui ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix ../ui run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --features custom-protocol --bins --jobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real WebView2 file drop and installation failure recovery
        run: |
          $taskNode = (Get-Command node).Source
          $taskNpm = Join-Path (Split-Path -Parent $taskNode) 'node_modules/npm/bin/npm-cli.js'
          & ../../../test/smoke/windows-install-recovery.ps1 -Executable target/debug/opencodex-desktop.exe -Node $taskNode -NpmCli $taskNpm -OutputDirectory ../../../test/out/windows-native-ui-diagnostic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native diagnostic including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-ui-diagnostic
          if-no-files-found: error
          path: |
            test/out/windows-native-ui-diagnostic
            !test/out/windows-native-ui-diagnostic/OpenCodeX Native*/**


  process-exit:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'process-exit'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Run original process ownership module with native Windows handles
        shell: pwsh
        run: |
          $taskRoot = Join-Path $env:RUNNER_TEMP 'ocx-process-exit'
          New-Item -ItemType Directory -Force (Join-Path $taskRoot 'src') | Out-Null
          $taskModule = ((Resolve-Path apps/desktop/tauri/src/infrastructure/windows_query_job.rs).Path).Replace('\','/')
          @'
          [package]
          name = "ocx-windows-process-exit-diagnostic"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          tokio = { version = "=1.53.1", features = ["rt","time","process","io-util"] }
          windows-sys = { version = "=0.61.2", features = ["Win32_Foundation","Win32_System_Diagnostics_ToolHelp","Win32_System_JobObjects","Win32_System_IO","Win32_System_SystemServices","Win32_System_Threading","Win32_Security"] }
          '@ | Set-Content (Join-Path $taskRoot 'Cargo.toml')
          ('#[path="'+$taskModule+'"] mod windows_query_job;') | Set-Content (Join-Path $taskRoot 'src/lib.rs')
          $env:OPENCODEX_TEST_NODE = (Get-Command node).Source
          Set-Location $taskRoot
          foreach($taskIteration in 1..30) {
            Write-Output "Native original module iteration $taskIteration"
            cargo test -- --nocapture
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          }

  ordinary-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'native-ui' && inputs.admission_run == 'ordinary-preflight-023'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.8.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify unchanged runner contracts
        shell: pwsh
        run: |
          $taskStatic = Join-Path $env:RUNNER_TEMP ('ocxd023-preflight-static-' + [guid]::NewGuid().ToString('N'))
          & test/smoke/windows023-rust-ordinary.test.ps1 -OutputDirectory $taskStatic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the real runner with a small default Rust test binary
        shell: pwsh
        run: |
          $taskEvidence = Join-Path $env:RUNNER_TEMP ('ocxd023-preflight-native-' + [guid]::NewGuid().ToString('N'))
          try {
            & test/smoke/windows023-rust-ordinary.ps1 -Cargo (Get-Command cargo.exe).Source -ManifestPath (Join-Path $PWD 'test/smoke/windows023-ordinary-preflight/Cargo.toml') -Node (Get-Command node.exe).Source -OutputDirectory $taskEvidence -ExpectedCommit (git rev-parse HEAD)
            if ($LASTEXITCODE -ne 0) { throw 'Ordinary runner preflight failed; original receipts retained' }
          } finally {
            New-Item -ItemType Directory -Force test/out/windows023-ordinary-preflight | Out-Null
            if (Test-Path -LiteralPath $taskEvidence) { Copy-Item -LiteralPath $taskEvidence -Destination test/out/windows023-ordinary-preflight/native -Recurse }
          }
      - name: Preserve exact native runner and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows023-ordinary-preflight-${{ github.sha }}
          path: test/out/windows023-ordinary-preflight
          if-no-files-found: warn
          retention-days: 14

  native-replay414:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'native-ui' && inputs.admission_run == 'native-replay-414'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26.8.1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42347427165
          artifact-ids: 13566576723
          path: test/out/native-replay414/input
      - name: Verify exact already built MSVC image and unchanged product source
        shell: pwsh
        run: |
          $inputRoot = (Resolve-Path test/out/native-replay414/input).Path
          $receipt = Get-Content (Join-Path $inputRoot 'candidate.json') -Raw | ConvertFrom-Json
          $expected = '414d62bab35060e8aa2011300dab926a66727946'
          if ($receipt.requestedHead -cne $expected -or $receipt.checkedCommit -cne '01032c5df1c6b8de849a9999a20a9e9b2d5efb3b' -or $receipt.appsTree -cne '95ca3f35cd29919bba22ec6d84bd867c2f35fc54' -or $receipt.runId -ne '42347427165' -or $receipt.target -cne 'x86_64-pc-windows-msvc') { throw 'Native original candidate identity mismatch' }
          $exe = Join-Path $inputRoot 'opencodex-desktop.exe'
          if ((Get-Item $exe).Length -ne 17220096 -or (Get-FileHash $exe).Hash -ine '4cf2f44e737024ab6ec599217839d90e926b83bed0551ab9a2b3e1b568081265') { throw 'Native original EXE bytes mismatch' }
          # Only test/workflow corrections can consume this original image.
          $changes = @(git diff --name-only $expected HEAD -- apps)
          if ($LASTEXITCODE -ne 0 -or $changes.Count) { throw 'Product source changed since original EXE' }
          & test/smoke/windows-ordinary-startup.ps1 -Executable $exe -Node (Get-Command node).Source -OutputDirectory test/out/native-replay414/evidence -ExpectedCommit $receipt.checkedCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-replay414-${{ github.sha }}
          path: |
            test/out/native-replay414/evidence/*.json
            test/out/native-replay414/evidence/*.log
            test/out/native-replay414/evidence/startup/*.json
            test/out/native-replay414/evidence/startup/*.log
            test/out/native-replay414/evidence/startup/*.png
          if-no-files-found: warn

  msi-compiler023:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'native-ui' && inputs.admission_run == 'msi-compiler-023'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop/tauri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.8.1
      - name: Install pinned bundle compiler only
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: Compile actual MSI template with explicitly synthetic payload
        run: |
          & ../../../test/smoke/windows023-msi-compiler.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact generated WiX and native compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows023-msi-compiler-${{ github.sha }}
          path: test/out/windows023-msi-compiler
          if-no-files-found: error
          retention-days: 14

  retention023:
    if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'installer-retention' && startsWith(inputs.admission_run, '{"mode":"retention023"')
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: nsis, scenario: adjacent}
          - {kind: nsis, scenario: fresh023}
          - {kind: msi, scenario: adjacent}
          - {kind: msi, scenario: explicit-conversion}
          - {kind: msi, scenario: fresh023}
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Verify bounded admission and retention fixture contracts
        run: |
          python test/smoke/windows023-retention-ci-admit.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskFixtures = Join-Path $env:RUNNER_TEMP ('ocxd023-retention-fixtures-' + [guid]::NewGuid().ToString('N'))
          & test/smoke/windows023-installer-retention.test.ps1 -OutputDirectory $taskFixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Admit published 0.2.22 and exact successful candidate bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OCXD_CANDIDATE_RUN: ${{ fromJSON(inputs.admission_run).candidate_run }}
          OCXD_CANDIDATE_ATTEMPT: ${{ fromJSON(inputs.admission_run).candidate_attempt }}
          OCXD_CANDIDATE_HEAD: ${{ fromJSON(inputs.admission_run).candidate_head }}
          OCXD_ARTIFACT_ID: ${{ fromJSON(inputs.admission_run).artifact_id }}
          OCXD_ARTIFACT_BYTES: ${{ fromJSON(inputs.admission_run).artifact_bytes }}
          OCXD_ARTIFACT_SHA256: ${{ fromJSON(inputs.admission_run).artifact_sha256 }}
          OCXD_INSTALLER_KIND: ${{ matrix.kind }}
          OCXD_INSTALLER_SCENARIO: ${{ matrix.scenario }}
        run: |
          python test/smoke/windows023-retention-ci-admit.py $env:OCXD_INSTALLER_KIND --scenario $env:OCXD_INSTALLER_SCENARIO --candidate-run $env:OCXD_CANDIDATE_RUN --candidate-attempt $env:OCXD_CANDIDATE_ATTEMPT --candidate-head $env:OCXD_CANDIDATE_HEAD --artifact-id $env:OCXD_ARTIFACT_ID --artifact-bytes $env:OCXD_ARTIFACT_BYTES --artifact-sha256 $env:OCXD_ARTIFACT_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual default upgrade uninstall and reinstall
        run: |
          foreach ($taskName in @('GITHUB_TOKEN','GH_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
            [Environment]::SetEnvironmentVariable($taskName, $null, 'Process')
          }
          & test/smoke/windows023-installer-retention.ps1 -AdmissionPath test/out/windows023-installer-retention/admission.json -Execute
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve admission execution and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows023-retention-${{ matrix.kind }}-${{ matrix.scenario }}-${{ github.sha }}
          path: test/out/windows023-installer-retention
          if-no-files-found: warn
          retention-days: 14
